<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B4332" />
      <stop offset="100%" stop-color="#0F281E" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2D6A4F" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1B4332" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#grad)" />
  <circle cx="400" cy="250" r="220" fill="url(#glow)" />
  <g transform="translate(400, 220)" text-anchor="middle">
    <!-- Produce Leaf Icon -->
    <path d="M-30,-20 C-30,-60 10,-80 40,-70 C40,-30 20,10 -20,20 C-30,20 -30,0 -30,-20 Z" fill="#52B788" opacity="0.9" />
    <path d="M-25,-15 C-5,-35 15,-50 35,-65" stroke="#1B4332" stroke-width="3" stroke-linecap="round" fill="none" />
    <!-- Brand Name -->
    <text y="50" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#E5B869" letter-spacing="3">MA GROUP</text>
    <text y="78" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#95D5B2" letter-spacing="4">FRESH &amp; FROZEN PRODUCE EXPORT</text>
  </g>
</svg>

